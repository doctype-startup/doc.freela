function renewal(c){if(!c.start||!Number(c.months))return null;const d=new Date(c.start+'T12:00:00');d.setMonth(d.getMonth()+Number(c.months));return d}

function renderClients(){document.querySelector('.workspace').classList.add('clients-mode');document.querySelector('#page-title').textContent='Clientes';document.querySelector('.workspace').innerHTML=`<div class="clients-shell"><div class="clients-head"><div><h2>Clientes</h2><p>Gerencie seus clientes cadastrados</p></div><div class="client-actions"><button type="button" class="c-btn ${clientsState.layout==='grid'?'active':''}" data-action="grid" aria-label="Visualizar em cartões">▦</button><button type="button" class="c-btn ${clientsState.layout==='list'?'active':''}" data-action="list" aria-label="Visualizar em lista">☷</button><button type="button" class="c-btn" data-action="tutorial">Tutorial</button><button type="button" class="c-btn" data-action="registration">Link de Cadastro</button><button type="button" class="c-btn" data-action="groups">Grupos</button><button type="button" class="c-btn primary" data-action="new">＋ Cadastrar Cliente</button></div></div><div class="client-filters"><label class="client-search"><span aria-hidden="true">⌕</span><input id="client-search" type="search" placeholder="Buscar por nome, email, empresa..." value="${esc(clientsState.search)}" aria-label="Buscar clientes"></label><label class="client-filter-check"><input id="show-archived" type="checkbox" ${clientsState.showArchived?'checked':''}> Mostrar arquivados</label></div><div class="stats" id="client-stats"></div><div class="client-grid ${clientsState.layout==='list'?'list':''}" id="client-list"></div></div>`;renderClientList();}
function renderClientList(){const now=new Date(),month=now.getMonth(),year=now.getFullYear();const active=clientsState.items.filter(c=>!c.archived);const newMonth=active.filter(c=>{const d=new Date(c.start);return d.getMonth()===month&&d.getFullYear()===year}).length;const renewing=active.filter(c=>{const d=renewal(c);return d&&d>=now&&d-now<=30*864e5}).length;document.querySelector('#client-stats').innerHTML=`<div class="stat">Total de Clientes<strong>${active.length}</strong></div><div class="stat">Novos este Mês<strong>${newMonth}</strong></div><div class="stat">Renovações próximas<strong>${renewing}</strong><small>nos próximos 30 dias</small></div>`;const q=clientsState.search.trim().toLocaleLowerCase('pt-BR');const result=clientsState.items.filter(c=>(clientsState.showArchived||!c.archived)&&[c.name,c.email,c.company,c.phone,c.project].some(s=>String(s||'').toLocaleLowerCase('pt-BR').includes(q)));document.querySelector('#client-list').innerHTML=result.length?result.map(c=>`<article class="client-card ${c.archived?'archived':''}" data-client-card="${c.id}" tabindex="0" aria-label="Abrir detalhes de ${esc(c.name)}"><div class="client-card-head"><div class="avatar" aria-hidden="true">${esc(c.name.slice(0,2).toUpperCase())}</div><div><h3>${esc(c.name)}</h3><span class="muted">${esc(c.project||'Sem projeto')}</span></div></div><p>✉ ${esc(c.email||'Sem e-mail')}</p><p>♧ ${esc(c.phone||'Sem telefone')}</p><p>▥ ${esc(c.company||'Sem empresa')}</p><div>${c.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join('')}</div><p class="muted">Desde ${formatDate(c.start)}${renewal(c)?' · Renovação '+renewal(c).toLocaleDateString('pt-BR'):''}</p><hr><div><span class="muted">Valor mensal</span><div class="value">${money(c.monthly)}</div></div><div class="card-bottom"><button class="c-btn" data-action="details" data-id="${c.id}">Detalhes</button><button class="c-btn" data-action="edit" data-id="${c.id}">Editar</button><button class="c-btn" data-action="archive" data-id="${c.id}">${c.archived?'Restaurar':'Arquivar'}</button></div></article>`).join(''):'<div class="client-empty">Nenhum cliente encontrado. Ajuste a busca ou cadastre um cliente.</div>'}
function field(name,label,value='',type='text',extra=''){return `<label class="form-field ${extra}">${label}<input name="${name}" type="${type}" value="${esc(value)}" ${name==='name'?'required':''}></label>`}

function contactRows(c){const rows=Array.isArray(c?.contacts)?c.contacts:[];return `<div class="contacts-heading"><div><h3>Contatos</h3><p>Pessoas de contato ligadas a este cliente.</p></div><button type="button" class="c-btn primary" data-action="new-contact" ${c?'':'disabled'}>＋ Adicionar</button></div>${rows.length?`<div class="contact-list">${rows.map(x=>`<div class="contact-row"><div class="contact-avatar">${esc((x.name||'?').slice(0,2).toUpperCase())}</div><div class="contact-info"><strong>${esc(x.name)}</strong>${x.primary?'<span class="contact-primary">Principal</span>':''}<small>${esc(x.role||'Contato')}${x.phone?' · '+esc(x.phone):''}${x.email?' · '+esc(x.email):''}</small>${x.notes?`<small>${esc(x.notes)}</small>`:''}${x.notify?'<small>Notificações por WhatsApp ativadas</small>':''}</div><div class="contact-actions"><button type="button" class="c-btn" data-action="edit-contact" data-id="${esc(x.id)}">Editar</button><button type="button" class="c-btn" data-action="delete-contact" data-id="${esc(x.id)}">Remover</button></div></div>`).join('')}</div>`:'<div class="contacts-empty"><span aria-hidden="true">♙</span><p>Nenhum contato cadastrado ainda.</p></div>'}`}
function driveFolderId(value){try{const url=new URL(value);if(!['drive.google.com','www.drive.google.com'].includes(url.hostname)||url.protocol!=='https:')return null;const id=url.pathname.match(/^\/drive\/(?:u\/\d+\/)?folders\/([a-zA-Z0-9_-]+)\/?$/)?.[1]||url.searchParams.get('id');return id&&/^[a-zA-Z0-9_-]{10,}$/.test(id)?id:null}catch{return null}}
function filesPanel(c){const id=c?.driveFolderId;return `<section class="form-section drive-panel"><h3>Arquivos do cliente</h3>${id?`<div class="drive-linked"><span aria-hidden="true">📁</span><div><strong>Pasta do Google Drive vinculada</strong><p class="small-note">${esc(c.name)} · acesso sujeito às permissões da sua conta Google</p></div><a class="c-btn primary" href="https://drive.google.com/drive/folders/${encodeURIComponent(id)}" target="_blank" rel="noopener noreferrer">Abrir pasta ↗</a></div><button class="c-btn" type="button" data-action="remove-drive-folder">Desvincular pasta</button>`:`<div class="drive-empty"><span aria-hidden="true">📁</span><strong>Nenhuma pasta vinculada</strong><p>Cole o endereço de uma pasta existente no Google Drive para associá-la a este cliente.</p></div>`}<div id="drive-folder-form"><label class="form-field">Link da pasta no Google Drive<input name="driveUrl" type="url" placeholder="https://drive.google.com/drive/folders/..." required></label><button type="button" data-action="save-drive-folder" class="c-btn primary" ${c?'':'disabled'}>${id?'Trocar pasta':'Vincular pasta'}</button></div><p class="small-note">O vínculo funciona nesta sessão. A conexão da conta, a lista de arquivos e a sincronização permanente dependem da integração Google Drive do aplicativo.</p></section>`}
function pendingPanel(c){const rows=c?.pending||[];return `<div class="contacts-heading"><div><h3>Pendências do cliente</h3><p>Materiais e informações que você precisa receber de ${esc(c?.name||'este cliente')}.</p></div><button type="button" class="c-btn primary" data-action="new-pending" ${c?'':'disabled'}>＋ Adicionar</button></div>${rows.length?`<div class="contact-list">${rows.map(x=>`<div class="contact-row"><div class="contact-info"><strong>${esc(x.title)}</strong><small>${esc(x.kind)} · ${esc(x.priority)}${x.deadline?' · Prazo '+formatDate(x.deadline):''}</small>${x.details?`<small>${esc(x.details)}</small>`:''}<small>${x.done?'Recebido':'Aguardando cliente'}${x.notify?' · Aviso por WhatsApp solicitado (envio não integrado)':''}</small></div><div class="contact-actions"><button type="button" class="c-btn" data-action="toggle-pending" data-id="${esc(x.id)}">${x.done?'Reabrir':'Marcar recebido'}</button><button type="button" class="c-btn" data-action="edit-pending" data-id="${esc(x.id)}">Editar</button><button type="button" class="c-btn" data-action="delete-pending" data-id="${esc(x.id)}">Remover</button></div></div>`).join('')}</div>`:'<div class="contacts-empty"><span aria-hidden="true">▤</span><p>Nenhuma pendência cadastrada.</p></div>'}`}
function refreshPending(){const panel=document.querySelectorAll('.client-modal .tab-panel')[4],c=clientsState.items.find(x=>x.id===clientsState.modal?.id);if(panel)panel.innerHTML=pendingPanel(c)}
function pendingOptions(items,selected){return items.map(v=>'<option '+(selected===v?'selected':'')+'>'+v+'</option>').join('')}
function openPending(id){const c=clientsState.items.find(x=>x.id===clientsState.modal?.id);if(!c){toast('Salve o cliente antes de adicionar pendências.');return}const x=(c.pending||[]).find(v=>v.id===id);document.querySelector('.pending-dialog')?.remove();const layer=document.createElement('div');layer.className='contact-dialog pending-dialog';layer.dataset.pendingId=id||'';layer.innerHTML=`<div class="contact-dialog-card" role="dialog" aria-modal="true" aria-label="${x?'Editar pendência':'Nova pendência'}"><div class="contact-dialog-head"><div><h2>${x?'Editar pendência':'Nova pendência'}</h2><p class="small-note">O que você precisa receber de ${esc(c.name)}?</p></div><button type="button" data-action="close-pending" aria-label="Fechar">×</button></div><form id="pending-form"><label>O que você precisa *<input name="title" required maxlength="160" placeholder="Ex.: Fotos da equipe para o post da história" value="${esc(x?.title)}"></label><label>Detalhes (opcional)<textarea name="details" rows="3" placeholder="Explique o que o cliente precisa enviar...">${esc(x?.details)}</textarea></label><div class="contact-two"><label>O cliente deve enviar<select name="kind">${pendingOptions(['Arquivos','Informações','Aprovação','Outro'],x?.kind)}</select></label><label>Prioridade<select name="priority">${pendingOptions(['Normal','Alta','Urgente'],x?.priority)}</select></label></div><label>Prazo (opcional)<input name="deadline" type="date" value="${esc(x?.deadline)}"></label><label class="contact-check"><input type="checkbox" name="notify" ${x?.notify?'checked':''}> Avisar no WhatsApp</label><p class="small-note">O envio automático pelo WhatsApp ainda depende da integração de Atendimento.</p><div class="contact-dialog-foot"><button type="button" class="c-btn" data-action="close-pending">Cancelar</button><button class="c-btn primary" type="submit">${x?'Salvar':'＋ Criar pendência'}</button></div></form></div>`;document.body.append(layer);layer.querySelector('[name=title]').focus()}
function closePending(){document.querySelector('.pending-dialog')?.remove()}
function savePending(form){const c=clientsState.items.find(x=>x.id===clientsState.modal?.id);if(!c)return;const data=Object.fromEntries(new FormData(form)),title=data.title?.trim();if(!title)return;const id=form.closest('.pending-dialog').dataset.pendingId;c.pending ||= [];const x=c.pending.find(v=>v.id===id);const values={title,details:data.details?.trim()||'',kind:data.kind,priority:data.priority,deadline:data.deadline,notify:!!data.notify};if(x)Object.assign(x,values);else c.pending.unshift({id:crypto.randomUUID(),...values,done:false});closePending();refreshPending();toast('Pendência salva nesta sessão.')} 
function renderModal(){let modal=clientsState.modal;if(!modal)return;document.querySelector('.modal-back')?.remove();let c=modal.id?clientsState.items.find(x=>x.id===modal.id):null;const title=modal.kind==='new'?'Cadastrar Cliente':modal.kind==='registration'?'Link de Cadastro':modal.kind==='groups'?'Grupos':modal.kind==='tutorial'?'Como usar Clientes':modal.kind==='technical'?'Ficha Técnica':'Detalhes do Cliente';let body='';if(['new','details','edit','technical'].includes(modal.kind)){const tabs=['Informações','Contatos','Projetos','Arquivos','Pendências','Serviços','Financeiro'];const tab=modal.kind==='new'?'Informações':clientsState.tab;const visibleTags=c?.tags||modal.tags||[];body=`${modal.kind!=='new'?`<div class="modal-tabs" role="tablist" aria-label="Seções do cliente">${tabs.map(t=>`<button role="tab" aria-selected="${tab===t}" class="${tab===t?'active':''}" data-action="tab" data-tab="${t}">${t}</button>`).join('')}</div><div class="detail-summary"><div class="avatar">${esc((c?.name||'CL').slice(0,2).toUpperCase())}</div><div><strong>${esc(c?.name)}</strong><div class="muted">${esc(c?.company||'')}</div></div></div>`:''}<form id="client-form"><div class="tab-panel" ${tab==='Informações'?'':'hidden'}>${section('Contato',`<div class="form-grid">${field('name','Nome do Cliente',c?.name)}${field('email','E-mail',c?.email,'email')}${field('phone','Telefone',c?.phone,'tel')}${field('whatsappGroup','Grupo de WhatsApp vinculado',c?.whatsappGroup)}</div>`)}${section('Dados e documentos',`<div class="form-grid">${field('company','Nome fantasia',c?.company,'text','full')}${field('document','CPF/CNPJ',c?.document)}${field('birth','Data de nascimento',c?.birth,'date')}${field('legalName','Razão Social',c?.legalName,'text','full')}</div>`)}${section('Endereço',`<div class="form-grid three">${field('cep','CEP',c?.cep)}${field('street','Rua / Avenida',c?.street)}${field('number','Número',c?.number)}${field('complement','Complemento',c?.complement)}${field('district','Bairro',c?.district)}${field('city','Cidade',c?.city)}${field('state','Estado',c?.state)}</div>`)}${section('Tags',`<div class="tag-editor" id="tag-editor">${visibleTags.map(t=>`<span class="tag">${esc(t)} <button type="button" data-action="remove-tag" data-tag="${esc(t)}" aria-label="Remover ${esc(t)}">×</button></span>`).join('')}</div><div class="form-grid"><label class="form-field">Adicionar tag<input id="tag-input" placeholder="Digite uma tag e pressione Enter"></label><button type="button" class="c-btn" data-action="add-tag" style="align-self:end">Adicionar</button></div>`)}${section('Projeto e pipeline',`<div class="form-grid">${field('project','Projeto',c?.project,'text','full')}${field('pipeline','Pipeline',c?.pipeline)}${select('stage','Etapa do Pipeline',c?.stage||'Em contato',['Em contato','Proposta','Negociação','Fechado','Pausado'])}</div>`)}${section('Gestão de contrato',`<div class="form-grid three">${field('start','Cliente desde',c?.start,'date')}${field('months','Meses contratados',c?.months,'number')}${field('monthly','Valor mensal (R$)',c?.monthly,'number')}</div>`)}${section('Observações',`<label class="form-field">Anotações<textarea name="notes">${esc(c?.notes)}</textarea></label>`)}</div><div class="tab-panel" ${tab==='Contatos'?'':'hidden'}>${contactRows(c)}</div>${tabs.slice(2).map(t=>`<div class="tab-panel" ${tab===t?'':'hidden'}>${t==='Projetos'?projectPanel(c):t==='Arquivos'?filesPanel(c):t==='Pendências'?pendingPanel(c):section(t,`<p class="small-note">Ainda não há ${t.toLocaleLowerCase('pt-BR')} vinculados a este cliente.</p>`)}</div>`).join('')}</form>`}else if(modal.kind==='registration'){body='<p class="small-note">O cadastro externo de clientes requer uma página pública e validação de acesso. Esta etapa será conectada quando o módulo de cadastro estiver pronto.</p>'}else if(modal.kind==='groups'){body='<p class="small-note">Os grupos de WhatsApp vinculados serão sincronizados após a integração de Atendimento.</p>'}else{body='<p class="small-note">Cadastre um cliente, use a busca para localizar seus dados e abra Detalhes para atualizar contrato, endereço, tags e contatos.</p>'}const root=document.createElement('div');root.className='modal-back';root.innerHTML=`<div class="client-modal" role="dialog" aria-modal="true" aria-label="${title}"><div class="modal-head"><h2>${title}</h2><div style="display:flex;gap:8px">${c&&modal.kind!=='technical'?`<button class="c-btn" data-action="technical" data-id="${c.id}">Ficha Técnica</button>`:''}<button class="c-btn" data-action="close" aria-label="Fechar">×</button></div></div><div class="modal-body">${body}</div><div class="modal-foot"><button class="c-btn" data-action="close">Fechar</button>${['new','edit','details','technical'].includes(modal.kind)?'<button class="c-btn primary" type="submit" form="client-form">Salvar cliente</button>':''}</div></div>`;document.body.append(root);root.querySelector('input[name="name"]')?.focus()}
function openModal(kind,id){clientsState.tab='Informações';clientsState.modal={kind,id};renderModal()}
function closeModal(){clientsState.modal=null;document.querySelector('.modal-back')?.remove()}
function saveClient(form){const values=Object.fromEntries(new FormData(form));const existing=clientsState.modal.id?clientsState.items.find(c=>c.id===clientsState.modal.id):null;const name=(values.name||existing?.name||'').trim();if(!name){toast('Informe o nome do cliente.');return}const c=existing||{id:String(Date.now()),tags:[...(clientsState.modal.tags||[])],archived:false,contacts:[]};Object.assign(c,values,{name,monthly:Math.max(0,Number(values.monthly??c.monthly)||0),contacts:c.contacts});if(!existing)clientsState.items.unshift(c);closeModal();renderClients();toast(existing?'Cliente atualizado nesta visualização.':'Cliente cadastrado nesta visualização.')}
document.addEventListener('input',e=>{if(e.target.id==='client-search'){clientsState.search=e.target.value;renderClientList()}});document.addEventListener('change',e=>{if(e.target.id==='show-archived'){clientsState.showArchived=e.target.checked;renderClientList()}});document.addEventListener('submit',e=>{if(e.target.id==='pending-form'){e.preventDefault();savePending(e.target);return}if(e.target.id==='contact-form'){e.preventDefault();saveContact(e.target);return}if(e.target.id==='client-form'){e.preventDefault();saveClient(e.target)}});document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){const card=e.target.closest('[data-client-card]');if(card)openModal('details',card.dataset.clientCard);return}const a=b.dataset.action,id=b.dataset.id;if(a==='grid'||a==='list'){clientsState.layout=a;renderClients()}else if(['new','details','edit','technical','registration','groups','tutorial'].includes(a))openModal(a,id);else if(a==='close')closeModal();else if(a==='new-pending')openPending();else if(a==='edit-pending')openPending(id);else if(a==='close-pending')closePending();else if(a==='toggle-pending'){const c=clientsState.items.find(x=>x.id===clientsState.modal?.id),x=c?.pending?.find(v=>v.id===id);if(x){x.done=!x.done;refreshPending()}}else if(a==='delete-pending'){const c=clientsState.items.find(x=>x.id===clientsState.modal?.id);if(c&&confirm('Remover esta pendência?')){c.pending=c.pending.filter(v=>v.id!==id);refreshPending()}}else if(a==='new-contact')openContact();else if(a==='save-drive-folder'){const c=clientsState.items.find(x=>x.id===clientsState.modal?.id),folderId=driveFolderId(document.querySelector('#drive-folder-form [name=driveUrl]')?.value);if(!folderId){toast('Informe o link de uma pasta válida do Google Drive.');return}if(c){c.driveFolderId=folderId;renderModal();toast('Pasta vinculada a este cliente nesta sessão.')}}else if(a==='remove-drive-folder'){const c=clientsState.items.find(x=>x.id===clientsState.modal?.id);if(c){delete c.driveFolderId;renderModal();toast('Pasta desvinculada nesta sessão.')}}else if(a==='edit-contact')openContact(id);else if(a==='delete-contact'){const c=clientsState.items.find(x=>x.id===clientsState.modal?.id);if(c&&confirm('Remover este contato?')){c.contacts=c.contacts.filter(x=>x.id!==id);refreshContacts();toast('Contato removido nesta visualização.')}}else if(a==='archive'){const c=clientsState.items.find(c=>c.id===id);c.archived=!c.archived;renderClientList();toast(c.archived?'Cliente arquivado nesta visualização.':'Cliente restaurado.')}else if(a==='tab'){clientsState.tab=b.dataset.tab;document.querySelectorAll('.modal-tabs button').forEach(x=>{x.classList.toggle('active',x.dataset.tab===clientsState.tab);x.setAttribute('aria-selected',String(x.dataset.tab===clientsState.tab))});document.querySelectorAll('.tab-panel').forEach((x,i)=>x.hidden=['Informações','Contatos','Projetos','Arquivos','Pendências','Serviços','Financeiro'][i]!==clientsState.tab)}else if(a==='add-tag'){const input=document.querySelector('#tag-input'),v=input.value.trim();if(!v)return;const c=clientsState.items.find(c=>c.id===clientsState.modal.id);const tags=c?c.tags:clientsState.modal.tags||(clientsState.modal.tags=[]);if(!tags.includes(v)){tags.push(v);const editor=document.querySelector('#tag-editor');const chip=document.createElement('span');chip.className='tag';chip.textContent=v+' ';const remove=document.createElement('button');remove.type='button';remove.dataset.action='remove-tag';remove.dataset.tag=v;remove.setAttribute('aria-label','Remover '+v);remove.textContent='×';chip.append(remove);editor.append(chip)}input.value=''}else if(a==='remove-tag'){const c=clientsState.items.find(c=>c.id===clientsState.modal.id);if(c)c.tags=c.tags.filter(t=>t!==b.dataset.tag);else clientsState.modal.tags=(clientsState.modal.tags||[]).filter(t=>t!==b.dataset.tag);b.closest('.tag').remove()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.querySelector('.pending-dialog'))closePending();else if(document.querySelector('.contact-dialog'))closeContact();else closeModal()}if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-client-card]')){e.preventDefault();openModal('details',e.target.dataset.clientCard)}if(e.key==='Enter'&&e.target.id==='tag-input'){e.preventDefault();document.querySelector('[data-action="add-tag"]')?.click()}});document.addEventListener('click',e=>{if(e.target.classList.contains('modal-back'))closeModal()});

function refreshContacts(){const panel=document.querySelectorAll('.client-modal .tab-panel')[1],c=clientsState.items.find(x=>x.id===clientsState.modal?.id);if(panel)panel.innerHTML=contactRows(c)}
function openContact(id){const client=clientsState.items.find(x=>x.id===clientsState.modal?.id);if(!client){toast('Salve o cliente antes de adicionar contatos.');return}const contact=client.contacts.find(x=>x.id===id);document.querySelector('.contact-dialog')?.remove();const layer=document.createElement('div');layer.className='contact-dialog';layer.innerHTML=`<div class="contact-dialog-card" role="dialog" aria-modal="true" aria-label="${contact?'Editar contato':'Novo contato'}"><div class="contact-dialog-head"><h2>${contact?'Editar contato':'Novo contato'}</h2><button type="button" data-action="close-contact" aria-label="Fechar">×</button></div><form id="contact-form"><label>Nome<input name="name" placeholder="Nome do contato" value="${esc(contact?.name)}" required autofocus></label><label>Cargo<input name="role" placeholder="Ex: Financeiro, Sócio, Comprador" value="${esc(contact?.role)}"></label><div class="contact-two"><label>Telefone<input name="phone" type="tel" placeholder="(00) 00000-0000" value="${esc(contact?.phone)}"></label><label>E-mail<input name="email" type="email" placeholder="email@exemplo.com" value="${esc(contact?.email)}"></label></div><label>Observações<textarea name="notes" rows="3">${esc(contact?.notes)}</textarea></label><label class="contact-check"><input type="checkbox" name="primary" ${contact?.primary?'checked':''}> Marcar como contato principal</label><label class="contact-check contact-notify"><input type="checkbox" name="notify" ${contact?.notify?'checked':''}><span><strong>Notificações por WhatsApp</strong><small>Enviar notificações automáticas para este contato via WhatsApp.</small></span></label><div class="contact-dialog-foot"><button type="button" class="c-btn" data-action="close-contact">Cancelar</button><button class="c-btn primary" type="submit">${contact?'Salvar':'Adicionar'}</button></div></form></div>`;layer.dataset.contactId=id||'';document.body.append(layer);layer.querySelector('[name="name"]').focus()}
function closeContact(){document.querySelector('.contact-dialog')?.remove()}
function saveContact(form){const client=clientsState.items.find(x=>x.id===clientsState.modal?.id),layer=document.querySelector('.contact-dialog');if(!client||!layer)return;const f=Object.fromEntries(new FormData(form)),name=(f.name||'').trim();if(!name){toast('Informe o nome do contato.');return}const existing=client.contacts.find(x=>x.id===layer.dataset.contactId);const data={id:existing?.id||String(Date.now()),name,role:(f.role||'').trim(),phone:(f.phone||'').trim(),email:(f.email||'').trim(),notes:(f.notes||'').trim(),primary:!!f.primary,notify:!!f.notify};if(data.primary)client.contacts.forEach(x=>x.primary=false);if(existing)Object.assign(existing,data);else client.contacts.push(data);closeContact();refreshContacts();toast('Contato salvo nesta visualização.')}
document.addEventListener('click',e=>{if(e.target.closest('[data-action="close-contact"]'))closeContact();else if(e.target.classList.contains('contact-dialog'))closeContact()});

</script><script>
const dashState={target:10000,range:'month',start:'',end:'',tasks:[],reminders:[],nps:[],activities:[],showPanels:true,dialog:null};
const dashCurrency=n=>new Intl.NumberFormat('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0}).format(n||0);
const dashToday=()=>new Date().toISOString().slice(0,10);
function dashClients(){return clientsState.items.filter(c=>!c.archived)}
function dashEarned(date){return dashClients().reduce((sum,c)=>{if(!c.start||!c.months)return sum;const start=new Date(c.start+'T12:00:00'),end=new Date(start);end.setMonth(end.getMonth()+Number(c.months));return date>=start&&date<end?sum+(Number(c.monthly)||0):sum},0)}
function dashPeriod(){const now=new Date(),start=dashState.start?new Date(dashState.start+'T00:00:00'):new Date(now.getFullYear(),now.getMonth(),1),end=dashState.end?new Date(dashState.end+'T23:59:59'):now;return {start,end}}
function dashValues(){const p=dashPeriod(),total=dashEarned(new Date()),newClients=dashClients().filter(c=>{let d=new Date(c.start+'T12:00:00');return d>=p.start&&d<=p.end}).length;return {total,newClients,closed:dashClients().filter(c=>c.stage==='Fechado').length}}
function dashLine(){const now=new Date(),points=Array.from({length:6},(_,i)=>{const d=new Date(now.getFullYear(),now.getMonth()-5+i,15);return {label:d.toLocaleString('pt-BR',{month:'short'}),value:dashEarned(d)}});const max=Math.max(1000,...points.map(p=>p.value))*1.2;const coords=points.map((p,i)=>`${35+i*125},${210-p.value/max*175}`);const area=`M ${coords[0]} L ${coords.slice(1).join(' L ')} L 660,210 L 35,210 Z`;return `<svg role="img" aria-label="Faturamento estimado dos últimos seis meses" viewBox="0 0 700 240" preserveAspectRatio="none"><defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff6400" stop-opacity=".4"/><stop offset="1" stop-color="#ff6400" stop-opacity=".02"/></linearGradient></defs><path d="M35 35H660M35 95H660M35 155H660M35 210H660" stroke="#34425a" stroke-dasharray="3 5"/><path d="${area}" fill="url(#g)"/><polyline points="${coords.join(' ')}" fill="none" stroke="#ff6400" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${coords.map(x=>`<circle cx="${x.split(',')[0]}" cy="${x.split(',')[1]}" r="4" fill="#ff6400"/>`).join('')}</svg><div class="chart-labels">${points.map(p=>`<span>${p.label}</span>`).join('')}</div>`}
function dashList(items,fn,empty){return items.length?`<ul class="dash-list">${items.map(fn).join('')}</ul>`:`<div class="dash-empty">${empty}</div>`}
function renderDashboard(){document.querySelector('.workspace').classList.remove('clients-mode');document.querySelector('.workspace').classList.add('dashboard-mode');document.querySelector('#page-title').textContent='Dashboard';const v=dashValues(),pct=Math.min(100,Math.round(v.total/Math.max(1,dashState.target)*100)),today=dashToday();const overdue=dashState.tasks.filter(t=>!t.done&&t.due<today),due=dashState.tasks.filter(t=>!t.done&&t.due===today),finished=dashState.tasks.filter(t=>t.done).length;const serviceTotals=new Map();dashClients().forEach(c=>{if(c.project)serviceTotals.set(c.project,(serviceTotals.get(c.project)||0)+(Number(c.monthly)||0))});const services=[...serviceTotals].sort((a,b)=>b[1]-a[1]);const maxService=Math.max(1,...services.map(s=>s[1]));const scores=dashState.nps.map(x=>Number(x.score)),nps=scores.length?Math.round((scores.filter(x=>x>=9).length-scores.filter(x=>x<=6).length)/scores.length*100):0;const w=document.querySelector('.workspace');w.innerHTML=`<div class="dash-wrap"><div class="dash-head"><div><h2>Dashboard</h2><p>Visão geral do seu negócio · Dados demonstrativos</p></div><div class="dash-controls"><select id="dash-range" aria-label="Filtros rápidos"><option value="month" ${dashState.range==='month'?'selected':''}>Este mês</option><option value="7" ${dashState.range==='7'?'selected':''}>Últimos 7 dias</option><option value="30" ${dashState.range==='30'?'selected':''}>Últimos 30 dias</option><option value="custom" ${dashState.range==='custom'?'selected':''}>Período personalizado</option></select><input id="dash-start" type="date" aria-label="Data inicial" value="${dashState.start}"/><span>–</span><input id="dash-end" type="date" aria-label="Data final" value="${dashState.end}"/><button class="dash-btn" data-dash="panels">${dashState.showPanels?'Ocultar':'Mostrar'} painéis</button><button class="dash-btn" data-dash="goal">Editar meta</button></div></div><div class="dash-top"><div class="dash-card"><div class="dash-card-head"><h3>Meta de Receita</h3><span class="accent">◎</span></div><p>Progresso do mês atual</p><div class="dash-meta"><span>${dashCurrency(v.total)}</span><strong class="accent">${dashCurrency(dashState.target)}</strong></div><div class="dash-progress" style="--progress:${pct}%"><i></i></div><div class="dash-meta"><span>${pct}% alcançado</span><span>Faltam ${dashCurrency(Math.max(0,dashState.target-v.total))}</span></div></div><div class="dash-card"><h3>＄</h3><div class="big positive">${dashCurrency(v.total)}</div><p>Faturamento mensal estimado</p></div><div class="dash-card"><h3>♧</h3><div class="big">${v.newClients}</div><p>Novos clientes no período</p></div><div class="dash-card"><h3>↗</h3><div class="big accent">${v.closed}</div><p>Clientes fechados</p></div></div><section class="dash-card dash-chart"><div class="dash-card-head"><div><h3>Análise Financeira Consolidada</h3><p>Estimativa por contratos ativos · últimos 6 meses</p></div><button class="dash-btn" data-dash="finance">Ver clientes</button></div>${dashLine()}</section><div id="dash-panels" ${dashState.showPanels?'':'hidden'}><div class="dash-grid two"><section class="dash-card"><h3>Receita por serviço</h3>${services.length?services.map(([name,n])=>`<div class="dash-service-row"><span title="${esc(name)}">${esc(name)}</span><span class="bar" style="--bar:${Math.round(n/maxService*100)}%"><i></i></span><b>${dashCurrency(n)}</b></div>`).join(''):'<div class="dash-empty">Nenhum serviço vinculado</div>'}</section><section class="dash-card"><h3>Composição da carteira</h3>${dashList(services,([name,n])=>`<li class="dash-row"><span>${esc(name)}</span><b>${Math.round(n/Math.max(1,v.total)*100)}%</b></li>`,'Nenhum cliente ativo')}</section></div><div class="dash-grid"><section class="dash-card"><div class="dash-card-head"><h3>Tarefas Diárias</h3><button class="dash-btn" data-dash="task">＋ Criar tarefa</button></div>${dashList(due,t=>`<li class="dash-row"><label><input type="checkbox" data-dash="complete" data-id="${t.id}"> ${esc(t.title)}</label><small>${esc(t.client||'')}</small></li>`,'Nenhuma tarefa para hoje')}</section><section class="dash-card"><h3>Projetos Recentes</h3>${dashList(dashClients().slice(0,5),c=>`<li><button data-dash="client" data-id="${c.id}">${esc(c.project||c.name)}</button><small>${esc(c.name)}</small></li>`,'Nenhum projeto cadastrado')}</section><section class="dash-card"><h3>Atividade Recente</h3>${dashList(dashState.activities.slice(0,6),a=>`<li>${esc(a.text)}<small>${esc(a.date)}</small></li>`,'As ações realizadas aparecerão aqui')}</section></div><div class="dash-grid"><section class="dash-card"><div class="dash-card-head"><h3>Tarefas Atrasadas</h3><b class="accent">${overdue.length}</b></div>${dashList(overdue,t=>`<li class="dash-row"><label><input type="checkbox" data-dash="complete" data-id="${t.id}"> ${esc(t.title)}</label><small>${esc(t.due)}</small></li>`,'Nenhuma tarefa atrasada')}</section><section class="dash-card"><h3>Tarefas para Hoje</h3>${dashList(due,t=>`<li class="dash-row"><span>${esc(t.title)}</span><button data-dash="complete" data-id="${t.id}">Concluir</button></li>`,'Nenhuma tarefa para hoje')}</section><section class="dash-card"><h3>Lembretes Rápidos</h3><form id="reminder-form" class="dash-input-row"><input name="reminder" maxlength="120" required placeholder="Adicionar lembrete..." aria-label="Adicionar lembrete"><button class="dash-btn orange" aria-label="Salvar lembrete">＋</button></form>${dashList(dashState.reminders,r=>`<li class="dash-row"><span>${esc(r.text)}</span><button data-dash="remove-reminder" data-id="${r.id}" aria-label="Excluir lembrete">×</button></li>`,'Nenhum lembrete ainda')}</section></div><div class="dash-grid"><section class="dash-card"><h3>Próximas Reuniões</h3><div class="dash-empty">Nenhuma reunião agendada</div><button class="dash-btn" data-dash="meeting">Agendar reunião</button></section><section class="dash-card"><h3>Estoque Baixo</h3><div class="dash-empty">Estoque sem produtos cadastrados</div><button class="dash-btn" data-dash="products">Ver produtos</button></section><section class="dash-card"><h3>Conteúdos do Dia</h3><div class="dash-empty">Nenhum conteúdo programado</div><button class="dash-btn" data-dash="content">Ver calendário</button></section></div><div class="dash-grid two"><section class="dash-card"><h3>Saúde de Relacionamento</h3><p>Clientes sem registro de reunião</p>${dashList(dashClients(),c=>`<li class="dash-row"><button data-dash="client" data-id="${c.id}">${esc(c.name)}</button><span class="accent">Sem reunião</span></li>`,'Nenhum cliente cadastrado')}</section><section class="dash-card"><div class="dash-card-head"><h3>Saúde dos Clientes (NPS)</h3><button class="dash-btn" data-dash="nps">＋ Registrar</button></div><div class="dash-nps"><div>NPS<b>${nps}</b></div><div>Promotores<b>${scores.filter(x=>x>=9).length}</b></div><div>Neutros<b>${scores.filter(x=>x>=7&&x<=8).length}</b></div><div>Detratores<b>${scores.filter(x=>x<=6).length}</b></div></div><p>${scores.length?'Respostas registradas: '+scores.length:'Registre uma avaliação para começar.'}</p></section></div><section class="dash-card" style="text-align:center;margin-top:15px;padding:35px"><h3>Diagnóstico do negócio</h3><p>Resumo baseado nos clientes, contratos e tarefas cadastrados nesta visualização.</p><button class="dash-btn orange" data-dash="diagnosis">Gerar diagnóstico</button><div id="dash-diagnosis"></div></section></div></div>`}
function dashOpen(kind){dashState.dialog=kind;document.querySelector('.dash-dialog')?.remove();let content='';if(kind==='goal')content=`<label>Meta mensal (R$)<input name="value" type="number" min="1" required value="${dashState.target}"></label>`;if(kind==='task')content='<label>Descrição da tarefa<input name="title" required maxlength="120"></label><label>Vencimento<input name="due" type="date" required></label><label>Cliente<input name="client" placeholder="Opcional"></label>';if(kind==='nps')content=`<label>Cliente<select name="client" required>${dashClients().map(c=>`<option value="${c.id}">${esc(c.name)}</option>`).join('')}</select></label><label>Nota de 0 a 10<input name="score" type="number" min="0" max="10" required></label>`;if(kind==='meeting')content='<label>Reunião<input name="title" required maxlength="120"></label><label>Data<input name="due" type="date" required></label>';if(!content)return;const root=document.createElement('div');root.className='dash-dialog';root.innerHTML=`<div role="dialog" aria-modal="true" aria-label="${kind}"><h3>${{goal:'Editar meta',task:'Criar tarefa',nps:'Registrar NPS',meeting:'Agendar reunião'}[kind]}</h3><form id="dash-form">${content}<div class="actions"><button type="button" class="dash-btn" data-dash="close">Cancelar</button><button class="dash-btn orange" type="submit">Salvar</button></div></form></div>`;document.body.append(root);root.querySelector('input,select')?.focus()}
function dashAction(action,id){if(['goal','task','nps','meeting'].includes(action)){dashOpen(action);return}if(action==='close'){document.querySelector('.dash-dialog')?.remove();return}if(action==='panels'){dashState.showPanels=!dashState.showPanels;renderDashboard();return}if(action==='client'){openModal('details',id);return}if(action==='finance'){menu.querySelector('[data-page="Clientes"]').click();return}if(action==='products'||action==='content'){menu.querySelector(`[data-page="${action==='products'?'Produtos':'Conteúdos'}"]`)?.click();return}if(action==='complete'){const t=dashState.tasks.find(t=>t.id===id);if(t){t.done=true;dashState.activities.unshift({text:'Tarefa concluída: '+t.title,date:new Date().toLocaleDateString('pt-BR')});renderDashboard()}return}if(action==='remove-reminder'){dashState.reminders=dashState.reminders.filter(r=>r.id!==id);renderDashboard();return}if(action==='diagnosis'){const v=dashValues();document.querySelector('#dash-diagnosis').innerHTML=`<p>Carteira ativa: ${dashClients().length} clientes · Receita mensal estimada: ${dashCurrency(v.total)} · Tarefas pendentes: ${dashState.tasks.filter(t=>!t.done).length} · Meta alcançada: ${Math.round(v.total/Math.max(1,dashState.target)*100)}%.</p>`}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-dash]');if(b)dashAction(b.dataset.dash,b.dataset.id);if(e.target.classList.contains('dash-dialog'))e.target.remove()});document.addEventListener('submit',e=>{if(e.target.id==='reminder-form'){e.preventDefault();const v=new FormData(e.target).get('reminder').trim();if(v)dashState.reminders.unshift({id:String(Date.now()),text:v});renderDashboard()}if(e.target.id==='dash-form'){e.preventDefault();const f=Object.fromEntries(new FormData(e.target));if(dashState.dialog==='goal')dashState.target=Number(f.value)||10000;if(dashState.dialog==='task')dashState.tasks.unshift({id:String(Date.now()),title:f.title.trim(),due:f.due,client:f.client,done:false});if(dashState.dialog==='meeting')dashState.tasks.unshift({id:String(Date.now()),title:'Reunião: '+f.title.trim(),due:f.due,client:'',done:false});if(dashState.dialog==='nps')dashState.nps.push({client:f.client,score:Number(f.score)});dashState.activities.unshift({text:({goal:'Meta atualizada',task:'Tarefa criada',meeting:'Reunião agendada',nps:'NPS registrado'})[dashState.dialog],date:new Date().toLocaleDateString('pt-BR')});document.querySelector('.dash-dialog')?.remove();renderDashboard()}});document.addEventListener('change',e=>{if(!['dash-range','dash-start','dash-end'].includes(e.target.id))return;if(e.target.id==='dash-range'){dashState.range=e.target.value;const now=new Date();if(e.target.value==='month')dashState.start=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10);else if(e.target.value==='7'||e.target.value==='30')dashState.start=new Date(now.getTime()-(Number(e.target.value)-1)*864e5).toISOString().slice(0,10);dashState.end=e.target.value==='custom'?dashState.end:dashToday()}else{dashState.range='custom';dashState.start=document.querySelector('#dash-start').value;dashState.end=document.querySelector('#dash-end').value}renderDashboard()});

renderDashboard();
menu.querySelectorAll('.item.active').forEach(el=>el.classList.remove('active'));
menu.querySelector('[data-page="Dashboard"]').classList.add('active');
</script><script>
const projectStore={projects:clientsState.items.map(c=>({id:'p-'+c.id,clientId:c.id,name:c.project||'Projeto principal',status:'Ativo',archived:false})),clientId:'',projectId:'',query:'',showArchived:false,view:'list',group:'date',dialog:null};
if(!dashState.tasks.length){const next=new Date(),tomorrow=new Date(next.getTime()+864e5);dashState.tasks.push({id:'demo-task-1',title:'Planejar campanha',clientId:'1',client:clientsState.items[0].name,projectId:'p-1',due:dashToday(),status:'A Fazer',done:false,archived:false},{id:'demo-task-2',title:'Revisar materiais',clientId:'2',client:clientsState.items[1].name,projectId:'p-2',due:tomorrow.toISOString().slice(0,10),status:'Em Progresso',done:false,archived:false})}
function getProject(id){return projectStore.projects.find(p=>p.id===id)}
function projectTasks(c){return dashState.tasks.filter(t=>t.clientId===c.id)}
function projectPanel(c){if(!c)return '<p class="small-note">Salve o cliente para vincular projetos e tarefas.</p>';const projects=projectStore.projects.filter(p=>p.clientId===c.id&&!p.archived),tasks=projectTasks(c);return `<div class="project-head"><p>Projetos e tarefas vinculados a este cliente.</p><div><button type="button" class="c-btn" data-project="open-board" data-id="${c.id}">Abrir quadro ↗</button><button type="button" class="c-btn primary" data-project="new-project" data-id="${c.id}">＋ Projeto</button></div></div><div class="project-label">▱ PROJETOS (${projects.length})</div>${projects.length?projects.map(p=>`<div class="project-entry"><button type="button" data-project="open-project" data-id="${p.id}">${esc(p.name)}</button><span>${esc(p.status)}</span></div>`).join(''):'<div class="project-empty">Nenhum projeto vinculado.</div>'}<div class="project-head" style="margin-top:18px"><div class="project-label">▤ TAREFAS (${tasks.length})</div><button type="button" class="c-btn" data-project="new-task" data-id="${c.id}">＋ Tarefa</button></div>${tasks.length?tasks.map(t=>`<div class="project-entry task"><div><strong>${esc(t.title)}</strong><small>Prazo: ${t.due?formatDate(t.due):'Sem prazo'} · ${esc(getProject(t.projectId)?.name||'Sem projeto')}</small></div><select data-project="status" data-id="${t.id}" aria-label="Status de ${esc(t.title)}"><option value="A Fazer" ${!t.done&&t.status!=='Em Progresso'?'selected':''}>A Fazer</option><option value="Em Progresso" ${t.status==='Em Progresso'?'selected':''}>Em Progresso</option><option value="Concluído" ${t.done?'selected':''}>Concluído</option></select></div>`).join(''):'<div class="project-empty">Nenhuma tarefa vinculada.</div>'}`}
function refreshProjectPanel(){const c=clientsState.items.find(x=>x.id===clientsState.modal?.id),el=document.querySelectorAll('.client-modal .tab-panel')[2];if(el)el.innerHTML=projectPanel(c)}
function boardTasks(){const q=projectStore.query.toLocaleLowerCase('pt-BR');return dashState.tasks.filter(t=>(!projectStore.clientId||t.clientId===projectStore.clientId)&&(!projectStore.projectId||t.projectId===projectStore.projectId)&&(projectStore.showArchived||!t.archived)&&(!q||[t.title,t.client,getProject(t.projectId)?.name].some(x=>String(x||'').toLocaleLowerCase('pt-BR').includes(q))))}
function boardRow(t){const c=clientsState.items.find(c=>c.id===t.clientId),p=getProject(t.projectId),late=t.due&&t.due<dashToday()&&!t.done;return `<div class="board-row"><div class="board-title"><strong>${esc(t.title)}</strong><small>${esc(c?.name||'Sem cliente')} · ${esc(p?.name||'Sem projeto')}</small></div><select data-project="status" data-id="${t.id}" aria-label="Status de ${esc(t.title)}"><option value="A Fazer" ${!t.done&&t.status!=='Em Progresso'?'selected':''}>A Fazer</option><option value="Em Progresso" ${t.status==='Em Progresso'?'selected':''}>Em Progresso</option><option value="Concluído" ${t.done?'selected':''}>Concluído</option></select><span class="${late?'late':''}">${t.due?formatDate(t.due):'Sem prazo'}</span><button type="button" class="board-icon" data-project="edit-task" data-id="${t.id}">Editar</button><button type="button" class="board-icon" data-project="archive-task" data-id="${t.id}">${t.archived?'Restaurar':'Arquivar'}</button></div>`}
function renderKanban(){document.querySelector('.workspace').classList.remove('clients-mode','dashboard-mode');document.querySelector('.workspace').classList.add('kanban-mode');document.querySelector('#page-title').textContent='Kanban';const tasks=boardTasks(),today=dashToday(),late=tasks.filter(t=>t.due&&t.due<today&&!t.done),due=tasks.filter(t=>t.due===today&&!t.done),later=tasks.filter(t=>!late.includes(t)&&!due.includes(t));document.querySelector('.workspace').innerHTML=`<div class="board-shell"><div class="board-top"><div><h2>Kanban</h2><p>Projetos e tarefas por cliente</p></div><div class="board-buttons"><button type="button" class="c-btn ${projectStore.view==='list'?'active':''}" data-project="view-list">☰ Lista</button><button type="button" class="c-btn ${projectStore.view==='grid'?'active':''}" data-project="view-grid">▦ Quadro</button><button type="button" class="c-btn" data-project="new-project">＋ Novo Projeto</button><button type="button" class="c-btn primary" data-project="new-task">＋ Criar Tarefa</button></div></div><div class="board-filters"><select id="board-client" aria-label="Filtrar por cliente"><option value="">Todos os clientes</option>${clientsState.items.filter(c=>!c.archived).map(c=>`<option value="${c.id}" ${projectStore.clientId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select><select id="board-project" aria-label="Filtrar por projeto"><option value="">Todos os projetos</option>${projectStore.projects.filter(p=>!p.archived).map(p=>`<option value="${p.id}" ${projectStore.projectId===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select><input id="board-search" type="search" placeholder="Buscar tarefas..." value="${esc(projectStore.query)}" aria-label="Buscar tarefas"><label><input type="checkbox" id="board-archived" ${projectStore.showArchived?'checked':''}> Ver arquivadas</label></div><div class="board-content ${projectStore.view==='grid'?'columns':''}">${[['Atrasadas',late],['Hoje',due],['Próximas e concluídas',later]].map(([name,rows])=>`<section class="board-group"><h3>${name} <span>${rows.length}</span></h3>${rows.length?rows.map(boardRow).join(''):'<p class="board-empty">Nenhuma tarefa neste período.</p>'}</section>`).join('')}</div></div>`}
function openProjectForm(clientId='',id=''){const p=getProject(id);const root=document.createElement('div');root.className='project-dialog';root.innerHTML=`<div role="dialog" aria-modal="true" aria-label="${p?'Editar projeto':'Novo projeto'}"><h2>${p?'Editar projeto':'Novo projeto'}</h2><form id="project-form"><label>Nome do projeto<input name="name" value="${esc(p?.name)}" required maxlength="120"></label><label>Cliente<select name="clientId" required><option value="">Selecione o cliente</option>${clientsState.items.filter(c=>!c.archived).map(c=>`<option value="${c.id}" ${(p?.clientId||clientId)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Status<select name="status"><option ${p?.status==='Ativo'?'selected':''}>Ativo</option><option ${p?.status==='Pausado'?'selected':''}>Pausado</option><option ${p?.status==='Concluído'?'selected':''}>Concluído</option></select></label><div class="dialog-actions"><button type="button" class="c-btn" data-project="close">Cancelar</button><button class="c-btn primary" type="submit">Salvar projeto</button></div></form></div>`;root.dataset.id=id;document.body.append(root);root.querySelector('input[name="name"]').focus()}
function openTaskForm(clientId='',id='',projectId=''){const task=dashState.tasks.find(t=>t.id===id);const root=document.createElement('div');root.className='project-dialog';root.innerHTML=`<div role="dialog" aria-modal="true" aria-label="${task?'Editar tarefa':'Nova tarefa'}"><h2>${task?'Editar tarefa':'Nova tarefa'}</h2><form id="task-form"><label>Título<input name="title" value="${esc(task?.title)}" required maxlength="160"></label><label>Cliente<select name="clientId" id="task-client" required><option value="">Selecione o cliente</option>${clientsState.items.filter(c=>!c.archived).map(c=>`<option value="${c.id}" ${(task?.clientId||clientId)===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><label>Projeto<select name="projectId" id="task-project"><option value="">Sem projeto</option>${projectStore.projects.filter(p=>!p.archived).map(p=>`<option value="${p.id}" ${(task?.projectId||projectId)===p.id?'selected':''}>${esc(p.name)}</option>`).join('')}</select></label><div class="form-grid"><label>Prazo<input name="due" type="date" value="${esc(task?.due)}"></label><label>Status<select name="status"><option ${task?.status==='A Fazer'?'selected':''}>A Fazer</option><option ${task?.status==='Em Progresso'?'selected':''}>Em Progresso</option><option ${task?.done?'selected':''}>Concluído</option></select></label></div><div class="dialog-actions"><button type="button" class="c-btn" data-project="close">Cancelar</button><button class="c-btn primary" type="submit">Salvar tarefa</button></div></form></div>`;root.dataset.id=id;document.body.append(root);root.querySelector('input[name="title"]').focus()}
function closeProjectForm(){document.querySelector('.project-dialog')?.remove()}
function refreshRelated(){if(document.querySelector('.workspace.kanban-mode'))renderKanban();refreshProjectPanel();if(document.querySelector('.workspace.dashboard-mode'))renderDashboard()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-project]');if(!b){if(e.target.classList.contains('project-dialog'))closeProjectForm();return}const a=b.dataset.project,id=b.dataset.id;if(a==='close')closeProjectForm();else if(a==='new-project')openProjectForm(id||projectStore.clientId);else if(a==='new-task')openTaskForm(id||projectStore.clientId);else if(a==='edit-task')openTaskForm('',id);else if(a==='open-project'){projectStore.projectId=id;projectStore.clientId=getProject(id)?.clientId||'';closeModal();menu.querySelector('[data-page="Kanban"]').click()}else if(a==='open-board'){projectStore.clientId=id;projectStore.projectId='';closeModal();menu.querySelector('[data-page="Kanban"]').click()}else if(a==='view-list'||a==='view-grid'){projectStore.view=a==='view-list'?'list':'grid';renderKanban()}else if(a==='archive-task'){const t=dashState.tasks.find(t=>t.id===id);if(t){t.archived=!t.archived;refreshRelated()}}});
document.addEventListener('change',e=>{if(e.target.dataset.project==='status'){const t=dashState.tasks.find(t=>t.id===e.target.dataset.id);if(t){t.status=e.target.value;t.done=t.status==='Concluído';refreshRelated()}}if(e.target.id==='board-client'){projectStore.clientId=e.target.value;projectStore.projectId='';renderKanban()}if(e.target.id==='board-project'){projectStore.projectId=e.target.value;renderKanban()}if(e.target.id==='board-archived'){projectStore.showArchived=e.target.checked;renderKanban()}});
document.addEventListener('input',e=>{if(e.target.id==='board-search'){projectStore.query=e.target.value;const pos=e.target.selectionStart;renderKanban();const input=document.querySelector('#board-search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('submit',e=>{if(!['project-form','task-form'].includes(e.target.id))return;e.preventDefault();const root=e.target.closest('.project-dialog'),v=Object.fromEntries(new FormData(e.target));if(e.target.id==='project-form'){if(!v.clientId){toast('Escolha um cliente.');return}const p=getProject(root.dataset.id);if(p)Object.assign(p,{name:v.name.trim(),clientId:v.clientId,status:v.status});else projectStore.projects.push({id:'p-'+Date.now(),name:v.name.trim(),clientId:v.clientId,status:v.status,archived:false})}else{if(!v.clientId){toast('Escolha um cliente.');return}const t=dashState.tasks.find(t=>t.id===root.dataset.id),client=clientsState.items.find(c=>c.id===v.clientId),data={title:v.title.trim(),clientId:v.clientId,client:client?.name||'',projectId:v.projectId,due:v.due,status:v.status,done:v.status==='Concluído'};if(t)Object.assign(t,data);else dashState.tasks.unshift({id:'t-'+Date.now(),...data,archived:false})}closeProjectForm();refreshRelated();toast('Alteração atualizada no cliente e no Kanban nesta visualização.')});

</script></body></html>
