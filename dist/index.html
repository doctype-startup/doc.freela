{name:'Agentes IA',icon:'spark',open:true,items:[['Visão geral','spark'],['Analista','brain',1],['Copywriter','robot',1],['Designer','palette',1],['Estúdio de IA','spark',1,'Estúdio de ...']]},
{name:'Operacional',icon:'check',open:true,items:[['Kanban','check'],['Conteúdos','calendar',1],['Agendamentos','send',1,'Agendame...'],['Relatórios operacionais','chart',1,'Relatórios ...'],['Anúncios Meta','megaphone',1,'Anúncios M...'],['Agenda','clock']]},

{name:'Equipe',icon:'building',page:true},
{name:'Aprendizagem',icon:'cap',page:true},
{name:'Configurações',icon:'gear',page:true}

const menu=document.querySelector('#menu');const dashboard=document.createElement('button');dashboard.className='item active';dashboard.dataset.page='Dashboard';dashboard.innerHTML=svg('dashboard')+'<span>Dashboard</span>';menu.append(dashboard);
groups.forEach((g,i)=>{const divider=document.createElement('div');divider.className='divider';menu.append(divider);const group=document.createElement('button');group.className='group';group.type='button';if(g.page){group.dataset.page=g.name;group.innerHTML=svg(g.icon)+'<span class="label">'+g.name+'</span>';menu.append(group);return}group.setAttribute('aria-expanded',String(g.open));group.setAttribute('aria-controls','group-'+i);group.innerHTML=svg(g.icon)+'<span class="label">'+g.name+'</span><svg class="icon chevron" viewBox="0 0 20 20"><path d="m5 12 5-5 5 5"/></svg>';menu.append(group);const sub=document.createElement('div');sub.className='sub';sub.id='group-'+i;sub.hidden=!g.open;g.items.forEach(([name,icon,beta,short])=>{const item=document.createElement('button');item.type='button';item.className='item';item.dataset.page=name;item.title=name;item.innerHTML=svg(icon)+'<span class="label">'+(short||name)+'</span>'+(beta?'<span class="beta">BETA</span>':'');sub.append(item)});menu.append(sub);group.addEventListener('click',()=>{const open=group.getAttribute('aria-expanded')==='true';group.setAttribute('aria-expanded',String(!open));sub.hidden=open})});
const sidebar=document.querySelector('#sidebar'),backdrop=document.querySelector('#backdrop'),hamburger=document.querySelector('#hamburger');function closeMenu(){sidebar.classList.remove('open');backdrop.classList.remove('open');hamburger.setAttribute('aria-expanded','false');hamburger.setAttribute('aria-label','Abrir menu')}hamburger.addEventListener('click',()=>{const open=sidebar.classList.toggle('open');backdrop.classList.toggle('open',open);hamburger.setAttribute('aria-expanded',String(open));hamburger.setAttribute('aria-label',open?'Fechar menu':'Abrir menu')});backdrop.addEventListener('click',closeMenu);document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});menu.addEventListener('click',e=>{const button=e.target.closest('[data-page]');if(!button)return;menu.querySelectorAll('.item.active').forEach(el=>el.classList.remove('active'));if(button.classList.contains('item'))button.classList.add('active');const page=button.dataset.page;document.querySelector('#page-title').textContent=page;document.querySelector('#section-title').textContent=page;document.querySelector('#canvas').textContent=page==='Dashboard'?'Conteúdo do dashboard em preparação.':'Conteúdo de '+page+' em preparação.';closeMenu()});
